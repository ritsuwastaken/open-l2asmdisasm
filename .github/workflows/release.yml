name: release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-2025-vs2026
            install_re2c: choco install re2c --no-progress -y
            configure_preset: msvc-x86
            build_preset: msvc-x86-build
            test_preset: msvc-x86-test
            package_preset: msvc-x86-package
          - os: ubuntu-26.04
            install_re2c: sudo apt-get update && sudo apt-get install -y re2c
            configure_preset: unix
            build_preset: unix-build
            test_preset: unix-test
            package_preset: unix-package
          - os: macos-26
            install_re2c: brew install re2c
            configure_preset: macos
            build_preset: macos-build
            test_preset: macos-test
            package_preset: macos-package
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install re2c
        run: ${{ matrix.install_re2c }}

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure, build, test and package
        uses: lukka/run-cmake@v10
        with:
          configurePreset: ${{ matrix.configure_preset }}
          buildPreset: ${{ matrix.build_preset }}
          testPreset: ${{ matrix.test_preset }}
          packagePreset: ${{ matrix.package_preset }}

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: build/*/l2asmdisasm-*-*.zip
