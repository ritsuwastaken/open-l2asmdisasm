name: release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-2025-vs2026
            install_re2c: choco install re2c --no-progress -y
            preset: msvc-x86
          - os: ubuntu-26.04
            install_re2c: sudo apt-get update && sudo apt-get install -y re2c
            preset: unix
          - os: macos-26
            install_re2c: brew install re2c
            preset: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install re2c
        run: ${{ matrix.install_re2c }}

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure, build, test and package
        uses: lukka/run-cmake@v10
        with:
          configurePreset: ${{ matrix.preset }}
          buildPreset: ${{ matrix.preset }}
          testPreset: ${{ matrix.preset }}
          packagePreset: ${{ matrix.preset }}

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: build/*/l2asmdisasm-*-*.zip
