name: release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        include:
          - { os: windows-2025-vs2026, preset: msvc-x86 }
          - { os: ubuntu-26.04, preset: unix }
          - { os: macos-26, preset: macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}
      - run: cpack --preset ${{ matrix.preset }}
      - uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: build/*/l2asmdisasm-*-*.zip
